# ============================================================================
# BUILD MANIFEST - Aetherial
# ============================================================================
# Authoritative record of how this project is built, tested and
# verified, and of what is still broken. Read by Aetherius-OS's
# build manifest registry and validated by
# src/programme/buildManifest.ts.
#
# Promoted from Temp/Repository-Reconciliation on 2026-10-20, where an earlier desktop-duplicate
# reconciliation had set it aside. The manifest records what was
# measured at the time of promotion, not what the repository's own
# documentation claims.
# ============================================================================
schema_version: "1.0.0"

project:
  id: aetherial
  name: Aetherial
  kind: application
  domain: aetherial
  description: >-
    Multi-facet platform and application, described in the repository as a Manus-style build.
    The largest first-party codebase the owner holds, and the one with no tests at all.
  repository: true
  branch: main
  languages: [js, jsx, py, sh, sql, ts, tsx]

toolchain:
  build_system: unknown
  package_manager: unknown
  requirements:
    - name: "a toolchain"
      version: "undetermined"
      required: true
      purpose: "the repository declares no build system yet"

commands:
  - name: inspect
    command: "echo 'no build system is declared by this repository'"
    working_directory: .
    timeout_minutes: 1

dependencies:
  projects: []
  external: []

status:
  state: PARTIAL
  last_verified: "2026-10-20"
  summary: >-
    The project holds 276820 lines of its own source and no tests. Nothing
    about it has been demonstrated to work.
  evidence:
    - "git remote get-url origin -> https://github.com/jayprophit/Aetherial.git"
    - "git rev-parse --abbrev-ref HEAD -> main"
    - "git log -1 --format=%H -> 6411079aec86da3a48ca97cec2ed0b6682544ea5"
    - "git log -1 --format=%ad --date=short -> 2025-07-28"
    - "Measured own source lines: 276820. Measured test files: 0."

known_issues:
  - id: AETHERIAL-TST-001
    severity: high
    summary: >-
      There is no test suite, so the build gate proves nothing.
    evidence: >-
      Measured own source lines: 276820, test files: 0.
    status: OPEN

notes:
  - >-
    Promoted into the workspace on 2026-10-20 from
    Temp/Repository-Reconciliation, where a desktop-duplicate
    reconciliation had set it aside. The repository was a clean
    clone of the owner's GitHub remote on the branch named above,
    with no uncommitted work at the time of promotion.
  - >-
    The state recorded here is what was measured at promotion. It
    is a starting point, and the gate that will move it forward is
    the build command recorded in the commands section above.
